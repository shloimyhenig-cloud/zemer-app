name: Collection Builder Compile Check

on:
  push:
    branches:
      - feature/my-collection
  workflow_dispatch:

concurrency:
  group: collection-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Configure Firebase for compile check
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "zemer-local-build",
              "storage_bucket": "zemer-local-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.jtech.zemer"
                  }
                },
                "api_key": [
                  { "current_key": "AIzaSyDUMMYKEYFORCOMPILEONLY000000000" }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin
